<!DOCTYPE html>
<html>

<head>
  <title>Upload Crime Detection Video</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f7f9fc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .upload-container {
      background-color: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 500px;
    }

    h1 {
      color: #333;
      margin-bottom: 20px;
    }

    input[type="file"] {
      padding: 10px;
      border: 2px dashed #007BFF;
      background-color: #f9f9f9;
      margin-bottom: 20px;
      width: 100%;
      border-radius: 6px;
    }

    button {
      background-color: #007BFF;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>

<body>

  <div class="upload-container">
    <h1>🚀 Upload Video for Crime Detection</h1>
    <form method="POST" enctype="multipart/form-data">
      <input type="file" name="video" required><br><br>
      <button type="submit">Upload & Analyze</button>
    </form>
  </div>

</body>

</html>
