<!DOCTYPE html>
<html>
<head>
    <title>Detection Results</title>
</head>
<body>
    <h1>Suspicious Frames</h1>
    {% for img in images %}
        <img src="{{ url_for('static', filename='results/' + img) }}" width="400"><br>
    {% endfor %}
    <h2>Running Detection Video</h2>
    <video width="640" controls>
        <source src="{{ url_for('static', filename='results/output_video.mp4') }}" type="video/mp4">
    </video>
</body>
</html>
